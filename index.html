<style>
  :root {
    --navy: #0f1f38;
    --navy2: #1a3355;
    --blue: #2563a8;
    --blue-light: #3b82d4;
    --accent: #e84c1e;
    --accent2: #ff6b3d;
    --gold: #f5a623;
    --white: #ffffff;
    --off-white: #f4f6fa;
    --muted: #8a9ab5;
    --text: #1a2740;
    --border: rgba(37,99,168,0.15);
    --card-bg: #ffffff;
    --row-alt: #f0f5fc;
    --finish-bg: #0f1f38;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--off-white);
    color: var(--text);
    min-height: 100vh;

  /* HEADER */
  header {
    background: var(--navy);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
  }

  .logo {
    font-family: 'Impact', 'Arial Narrow', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--white);
    padding: 16px 0;
    flex-shrink: 0;
  }

  .logo span { color: var(--accent); }

  .header-title {
    font-family: 'Impact', 'Arial Narrow', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--muted);
    flex: 1;
    text-align: center;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 0;
    flex-shrink: 0;
  }

  .tab-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 20px 20px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }

  .tab-btn:hover { color: var(--white); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* MAIN */
  main { max-width: 1400px; margin: 0 auto; padding: 2rem; }

  .view { display: none; }
  .view.active { display: block; }

  /* ===== CALCULATEUR ===== */
  .calc-hero {
    background: var(--navy);
    border-radius: 16px;
    padding: 2.5rem 3rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 3rem;
    flex-wrap: wrap;
  }

  .calc-label-group { flex: 1; min-width: 200px; }

  .calc-label {
    font-family: 'Impact', 'Arial Narrow', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .calc-title {
    font-family: 'Impact', 'Arial Narrow', sans-serif;
    font-size: 36px;
    letter-spacing: 2px;
    color: var(--white);
    line-height: 1;
  }

  .calc-title span { color: var(--accent); }

  .input-group {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .time-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--blue-light);
    border-radius: 12px;
    padding: 12px 16px;
  }

  .time-sep {
    font-family: 'Impact', 'Arial Narrow', sans-serif;
    font-size: 28px;
    color: var(--blue-light);
    padding: 0 2px;
    line-height: 1;
  }

  .time-unit-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    display: block;
    margin-top: 2px;

  .time-col { display: flex; flex-direction: column; align-items: center; }

  .time-spin {
    background: transparent;
    border: none;
    color: var(--white);
    font-family: 'Courier New', Courier, monospace;
    font-size: 32px;
    font-weight: 500;
    width: 56px;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;

  .pace-display {
    background: rgba(229, 76, 30, 0.12);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 20px;
    text-align: center;

    font-family: 'Impact', 'Arial Narrow', sans-serif;
    font-size: 28px;
    color: var(--accent2);
    letter-spacing: 2px;

  .pace-sub {

    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

    flex-wrap: wrap;

    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    font-family: 'Impact', 'Arial Narrow', sans-serif;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
  }

  .btn:active { transform: scale(0.98); }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .btn-primary {
    background: var(--accent);
    color: var(--white);
    box-shadow: 0 6px 20px rgba(232,76,30,0.3);

  .btn-ghost {

    position: fixed;
    left: 50%;

    transform: translate(-50%, 20px);
    background: var(--navy);
    color: var(--white);
    padding: 12px 20px;
    border-radius: 10px;

    box-shadow: 0 8px 30px rgba(0,0,0,0.3);

    transition: opacity 0.25s, transform 0.25s;

    color: var(--muted);

  .pass-table tbody tr:nth-child(even) { background: var(--row-alt); }
  .pass-table tbody tr:hover { background: #dce8f8; }

    background: var(--finish-bg) !important;

  .pass-table tbody tr.finish-row td {
    color: var(--white) !important;
  }

    padding: 13px 20px;
    font-size: 15px;
    color: var(--text);

  .km-badge {
    display: inline-block;
    background: var(--navy);
    color: var(--white);
    font-family: 'Impact', 'Arial Narrow', sans-serif;
    font-size: 14px;

    padding: 4px 12px;
    border-radius: 6px;

    background: var(--accent);

  .time-cell {

    font-size: 16px;
    font-weight: 500;
    color: var(--navy2);
    text-align: center;

  .finish-row .time-cell { color: var(--white); font-size: 18px; }

  .pace-cell {
    font-family: 'Courier New', Courier, monospace;

    color: var(--muted);
    text-align: center;

  .finish-row .pace-cell { color: var(--gold); }

    text-align: center;
    font-family: 'Courier New', Courier, monospace;

  .finish-row .split-cell { color: rgba(255,255,255,0.6); }

  .bar-col { width: 140px; }

  .progress-bar-bg {
    background: rgba(37,99,168,0.12);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;

  .progress-bar-fill {
    background: linear-gradient(90deg, var(--blue), var(--accent));

    background: var(--navy);
    border-radius: 16px;

    margin-bottom: 2rem;

    font-family: 'Impact', 'Arial Narrow', sans-serif;

    letter-spacing: 3px;

    display: flex;
    align-items: center;

    padding: 8px 12px;

  .range-sep {
    color: var(--muted);

    letter-spacing: 2px;

  .ref-hint {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;

  /* GRILLE TABLE */
  .grid-wrapper {
    overflow-x: auto;
    border-radius: 16px;
    box-shadow: 0 2px 24px rgba(15,31,56,0.08);
  }

  .grid-table {
    border-collapse: collapse;
    background: var(--card-bg);
    min-width: 100%;
    white-space: nowrap;
  }

  .grid-table th {
    background: var(--navy);

  .grid-table th.km-head {

    color: var(--muted);

    letter-spacing: 2px;

    vertical-align: bottom;

  .grid-table th .obj-time {
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    font-weight: 500;

  .grid-table th .obj-pace {
    font-family: 'Courier New', Courier, monospace;
    font-size: 10px;
    color: var(--blue-light);

    padding: 0 10px 8px;
    text-align: center;

  .grid-table td {
    padding: 9px 12px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    text-align: center;

  .grid-table tr:nth-child(even) td { background: var(--row-alt); }

  .grid-table td.km-cell {
    background: var(--navy2) !important;

  .grid-table tr.finish-row td.km-cell { background: var(--accent) !important; color: var(--white) !important; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);

  /* RESPONSIVE */

<header>

<main>

  <!-- ====== ONGLET CALCULATEUR ====== -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const MARATHON = 42.195;
const KM_POINTS = [5, 10, 15, 20, 25, 30, 35, 40, 42.195];

function toSec(h, m, s) { return h*3600 + m*60 + s; }

function fmtTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function fmtPace(secPerKm) {
  const m = Math.floor(secPerKm / 60);
  const s = Math.floor(secPerKm % 60);
  return `${m}'${String(s).padStart(2,'0')}"`;
}

function fmtTimeShort(totalSec) {
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m}min`;
}

// All objectives 2h30 → 5h00 every 5 min
const ALL_OBJ = [];
for (let s = toSec(2,30,0); s <= toSec(5,0,0); s += 300) ALL_OBJ.push(s);

// ===== CALCULATEUR =====
function getTargetSec() {
  const h = parseInt(document.getElementById('inp-h').value) || 0;
  const m = parseInt(document.getElementById('inp-m').value) || 0;
  const s = parseInt(document.getElementById('inp-s').value) || 0;
  return toSec(h, m, s);
}

function renderCalc() {
  const target = getTargetSec();
  if (target < 1800) return;

  const pacePerKm = target / MARATHON;
  const pm = Math.floor(pacePerKm / 60);
  const ps = Math.floor(pacePerKm % 60);
  document.getElementById('pace-display').textContent = `${pm}'${String(ps).padStart(2,'0')}"/km`;

  syncUrl(target);

  const tbody = document.getElementById('calc-tbody');
  tbody.innerHTML = '';
  let prevSplit = 0;

  KM_POINTS.forEach((km, i) => {
    const isFinish = km === 42.195;
    const passage = target * (km / MARATHON);
    const splitDist = i === 0 ? 5 : km - KM_POINTS[i-1];
    const splitTime = passage - prevSplit;
    const pct = (km / MARATHON) * 100;
    prevSplit = passage;

    const tr = document.createElement('tr');
    if (isFinish) tr.classList.add('finish-row');

    tr.innerHTML = `
      <td><span class="km-badge">${isFinish ? '42.195 km' : km + ' km'}</span></td>
      <td class="time-cell">${fmtTime(passage)}</td>
      <td class="pace-cell">${fmtPace(pacePerKm)}/km</td>
      <td class="split-cell">${fmtTime(splitTime)}</td>
      <td class="bar-col">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${pct.toFixed(1)}%"></div>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

['inp-h','inp-m','inp-s'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderCalc);
});

// Clamp minutes/seconds
document.getElementById('inp-m').addEventListener('blur', function() {
  if (parseInt(this.value) > 59) this.value = 59;
  if (parseInt(this.value) < 0) this.value = 0;
  renderCalc();
});
document.getElementById('inp-s').addEventListener('blur', function() {
  if (parseInt(this.value) > 59) this.value = 59;
  if (parseInt(this.value) < 0) this.value = 0;
  renderCalc();
});

// ===== GRILLE RÉFÉRENCE =====
function populateSelects() {
  const startSel = document.getElementById('ref-start');
  const endSel = document.getElementById('ref-end');
  ALL_OBJ.forEach(s => {
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    const label = `${h}h${String(m).padStart(2,'0')}`;
    startSel.add(new Option(label, s));
    endSel.add(new Option(label, s));
  });
  startSel.value = toSec(3,0,0);
  endSel.value = toSec(4,0,0);
}

function renderGrid() {
  const startSec = parseInt(document.getElementById('ref-start').value);
  const endSec   = parseInt(document.getElementById('ref-end').value);
  const objectives = ALL_OBJ.filter(s => s >= startSec && s <= endSec);

  const table = document.getElementById('grid-table');
  table.innerHTML = '';

  // Header row 1: objectifs
  const thead = document.createElement('thead');
  const tr1 = document.createElement('tr');
  const th0 = document.createElement('th');
  th0.className = 'km-head';
  th0.innerHTML = 'KM';
  tr1.appendChild(th0);

  objectives.forEach(objSec => {
    const h = Math.floor(objSec/3600);
    const m = Math.floor((objSec%3600)/60);
    const pacePerKm = objSec / MARATHON;
    const pm = Math.floor(pacePerKm/60);
    const ps = Math.floor(pacePerKm%60);
    const th = document.createElement('th');
    th.innerHTML = `<span class="obj-time">${h}h${String(m).padStart(2,'0')}</span><span class="obj-pace">${pm}'${String(ps).padStart(2,'0')}"/km</span>`;
    tr1.appendChild(th);
  });
  thead.appendChild(tr1);
  table.appendChild(thead);

  // Body
  const tbody = document.createElement('tbody');
  KM_POINTS.forEach(km => {
    const isFinish = km === 42.195;
    const tr = document.createElement('tr');
    if (isFinish) tr.classList.add('finish-row');

    const tdKm = document.createElement('td');
    tdKm.className = 'km-cell';
    tdKm.textContent = isFinish ? '42.2' : km;
    tr.appendChild(tdKm);

    objectives.forEach(objSec => {
      const passage = objSec * (km / MARATHON);
      const td = document.createElement('td');
      td.textContent = fmtTime(passage);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

// ===== TABS =====
function switchTab(tab) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');

}

// ===== LIEN PARTAGEABLE (?objectif=3h30) =====
// Formats acceptés : 3h30, 3h30m15, 3h30:15, 3:30, 3:30:15, 3h
function parseObjective(str) {
  if (!str) return null;
  const v = String(str).trim().toLowerCase().replace(/\s+/g, '');
  const m = v.match(/^(\d{1,2})(?:[h:](\d{1,2})?(?:[m:'](\d{1,2})s?)?)?$/);
  if (!m) return null;
  const h = parseInt(m[1], 10), mi = parseInt(m[2] || '0', 10), se = parseInt(m[3] || '0', 10);
  if (h < 1 || h > 9 || mi > 59 || se > 59) return null;
  return { h, m: mi, s: se };
}

function objectiveSlug(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
  return `${h}h${String(m).padStart(2,'0')}` + (s ? `m${String(s).padStart(2,'0')}` : '');
}

function objectiveLabel(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
  return `${h}h${String(m).padStart(2,'0')}` + (s ? `'${String(s).padStart(2,'0')}` : '');
}

function applyUrlObjective() {
  const obj = parseObjective(new URLSearchParams(location.search).get('objectif'));
  if (!obj) return;
  document.getElementById('inp-h').value = obj.h;
  document.getElementById('inp-m').value = obj.m;
  document.getElementById('inp-s').value = obj.s;
}

function shareUrl(sec) {
  const url = new URL(location.href);
  url.hash = '';
  url.searchParams.set('objectif', objectiveSlug(sec));
  return url.toString();
}

function syncUrl(sec) {
  try { history.replaceState(null, '', shareUrl(sec)); } catch (e) { /* file:// ou iframe */ }
  document.title = `Objectif ${objectiveLabel(sec)} — Temps de passage Marathon — RPT Hybrid`;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

document.getElementById('btn-link').addEventListener('click', async () => {
  const target = getTargetSec();
  if (target < 1800) return toast('Indique d\'abord un temps objectif');
  const url = shareUrl(target);
  const isTouch = matchMedia('(pointer: coarse)').matches;
  if (isTouch && navigator.share) {
    try {
      await navigator.share({ title: `Mon plan marathon : objectif ${objectiveLabel(target)}`, url });
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    toast('Lien copié ! Colle-le en story, en bio ou en message.');
  } catch (e) {
    window.prompt('Copie ce lien :', url);
  }
});

// ===== STORY 9:16 « MON PLAN DE COURSE » =====
// Adresse affichée en bas de la story (à adapter si le site change de domaine)
const SITE_LABEL = 'rpt-hybrid.com';
const STORY_W = 1080, STORY_H = 1920;
const F_DISPLAY = "Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Black', sans-serif";
const F_MONO = "'Courier New', Courier, monospace";
const F_SANS = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function spaced(ctx, text, x, y, spacing, align) {
  // Texte avec interlettrage (canvas letterSpacing n'est pas partout)
  const chars = [...text];
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const prev = ctx.textAlign;
  ctx.textAlign = 'left';
  chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += widths[i] + spacing; });
  ctx.textAlign = prev;
  return total;
}

function drawStory(target) {
  const c = document.createElement('canvas');
  c.width = STORY_W; c.height = STORY_H;
  const ctx = c.getContext('2d');
  const cx = STORY_W / 2;
  const pace = target / MARATHON;

  // Fond
  const bg = ctx.createLinearGradient(0, 0, 0, STORY_H);
  bg.addColorStop(0, '#0f1f38');
  bg.addColorStop(1, '#081426');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, STORY_W, STORY_H);

  // Halo orange en haut à droite
  const glow = ctx.createRadialGradient(STORY_W, 0, 0, STORY_W, 0, 900);
  glow.addColorStop(0, 'rgba(232,76,30,0.35)');
  glow.addColorStop(1, 'rgba(232,76,30,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, STORY_W, STORY_H);

  // Bande diagonale discrète
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = '#3b82d4';
  ctx.translate(cx, 520);
  ctx.rotate(-0.2);
  ctx.fillRect(-900, -90, 1800, 180);
  ctx.restore();

  ctx.textBaseline = 'alphabetic';

  // Logo
  ctx.font = `64px ${F_DISPLAY}`;
  const logo = [...'RPT.HYBRID'];
  const lw = logo.map(ch => ctx.measureText(ch).width);
  let lx = cx - (lw.reduce((a, b) => a + b, 0) + 6 * (logo.length - 1)) / 2;
  ctx.textAlign = 'left';
  logo.forEach((ch, i) => {
    ctx.fillStyle = ch === '.' ? '#e84c1e' : '#ffffff';
    ctx.fillText(ch, lx, 230);
    lx += lw[i] + 6;
  });

  // Libellé
  ctx.fillStyle = '#8a9ab5';
  ctx.font = `38px ${F_DISPLAY}`;
  spaced(ctx, 'MON PLAN DE COURSE', cx, 330, 8, 'center');

  // Objectif géant
  ctx.fillStyle = '#ff6b3d';
  const big = objectiveLabel(target).toUpperCase();
  let size = 250;
  ctx.font = `${size}px ${F_DISPLAY}`;
  while (ctx.measureText(big).width > 900 && size > 120) { size -= 10; ctx.font = `${size}px ${F_DISPLAY}`; }
  ctx.textAlign = 'center';
  ctx.fillText(big, cx, 570);

  ctx.fillStyle = '#ffffff';
  ctx.font = `46px ${F_DISPLAY}`;
  spaced(ctx, 'MARATHON · 42,195 KM', cx, 650, 5, 'center');

  // Pastille allure
  const pillW = 520, pillH = 96, pillX = cx - pillW / 2, pillY = 700;
  roundRect(ctx, pillX, pillY, pillW, pillH, 22);
  ctx.fillStyle = 'rgba(232,76,30,0.14)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#e84c1e';
  ctx.stroke();
  ctx.fillStyle = '#ff6b3d';
  ctx.font = `56px ${F_DISPLAY}`;
  ctx.textAlign = 'right';
  ctx.fillText(`${fmtPace(pace)}/km`, cx + 70, pillY + 68);
  ctx.fillStyle = '#8a9ab5';
  ctx.font = `600 24px ${F_SANS}`;
  ctx.textAlign = 'left';
  spaced(ctx, 'ALLURE', cx + 96, pillY + 44, 3, 'left');
  spaced(ctx, 'CIBLE', cx + 96, pillY + 74, 3, 'left');

  // Tableau des passages
  const tX = 90, tW = STORY_W - 180, rowH = 84, tY = 860;
  ctx.fillStyle = '#8a9ab5';
  ctx.font = `26px ${F_DISPLAY}`;
  spaced(ctx, 'POINT KM', tX + 28, tY - 18, 4, 'left');
  spaced(ctx, 'PASSAGE', tX + tW - 28, tY - 18, 4, 'right');

  KM_POINTS.forEach((km, i) => {
    const y = tY + i * rowH;
    const isFinish = km === MARATHON;
    roundRect(ctx, tX, y + 6, tW, rowH - 12, 16);
    ctx.fillStyle = isFinish ? '#e84c1e' : (i % 2 ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.08)');
    ctx.fill();

    // Barre de progression sous la ligne
    if (!isFinish) {
      ctx.fillStyle = 'rgba(59,130,212,0.55)';
      ctx.fillRect(tX + 28, y + rowH - 14, (tW - 56) * (km / MARATHON), 3);
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = `44px ${F_DISPLAY}`;
    ctx.textAlign = 'left';
    ctx.fillText(isFinish ? 'ARRIVÉE' : `${km} KM`, tX + 28, y + 57);

    ctx.font = `bold 46px ${F_MONO}`;
    ctx.textAlign = 'right';
    ctx.fillStyle = isFinish ? '#ffffff' : '#f4f6fa';
    ctx.fillText(fmtTime(target * (km / MARATHON)), tX + tW - 28, y + 58);
  });

  // Pied de story
  const fy = tY + KM_POINTS.length * rowH + 70;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = `600 34px ${F_SANS}`;
  ctx.fillText('Calcule ton plan de course sur', cx, fy);
  ctx.fillStyle = '#f5a623';
  ctx.font = `40px ${F_DISPLAY}`;
  spaced(ctx, SITE_LABEL.toUpperCase(), cx, fy + 58, 3, 'center');
  ctx.fillStyle = '#8a9ab5';
  ctx.font = `26px ${F_SANS}`;
  ctx.fillText('Coaching course à pied · musculation · hybride', cx, fy + 106);

  return c;
}

document.getElementById('btn-story').addEventListener('click', async (ev) => {
  const btn = ev.currentTarget;
  const target = getTargetSec();
  if (target < 1800) return toast('Indique d\'abord un temps objectif');
  btn.disabled = true;
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = drawStory(target);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const name = `plan-marathon-${objectiveSlug(target)}-rpt-hybrid.png`;
    const file = new File([blob], name, { type: 'image/png' });

    // Sur mobile : feuille de partage (Instagram, Photos…). Sinon : téléchargement.
    const isTouch = matchMedia('(pointer: coarse)').matches;
    if (isTouch && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Mon plan de course marathon' });
        return;
      } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Story téléchargée ! Publie-la et identifie-nous 🔥');
  } finally {
    btn.disabled = false;
  }
});

// INIT
applyUrlObjective();
renderCalc();
populateSelects();
renderGrid();
</script>
